<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" href="assets/icon.ico" type="image/x-icon">
<title>Deathbat Game</title>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: #1e0000;
  font-family: Arial, sans-serif;
  color: white;
  display: flex;
  justify-content: center;
}

#main-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 30px;
  gap: 16px;
}

h1 {
  margin: 0;
  font-size: 36px;
  color: #ffffff;
  text-shadow: 0 0 25px rgba(225, 201, 19, 0.4);
}

#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

canvas {
  background: black;
  border-radius: 12px;
  border: 3px solid #ffd000;
  box-shadow: 0 0 25px rgba(225, 201, 19, 0.4);
}

#controls {
  background: rgba(0,0,0,0.6);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
}

.key {
  background: #704406;
  border: 1px solid #ffc800;
  border-radius: 4px;
  padding: 2px 6px;
  margin: 0 2px;
  font-family: monospace;
}
</style>
</head>

<body>

<div id="main-container">

<h1>Deathbat Game!</h1>

<div id="game-container">
  <canvas id="game"></canvas>

  <div id="controls">
    Controles:
    <span class="key">←</span>
    <span class="key">→</span> Moverse |
    <span class="key">Espacio</span> Saltar |
    <a> 2 <span class="key">Espacio</span> Doble Salto </a>
  </div>
</div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = 900;
canvas.height = 500;

// Imágenes en assets
const playerImg = new Image();
playerImg.src = "assets/ninio.png";

const fondoImg = new Image();
fondoImg.src = "assets/fondo.png";

const plataformaImg = new Image();
plataformaImg.src = "assets/plataforma.png";

const enemigoImg = new Image();
enemigoImg.src = "assets/enemigos.png";

const vidaImg = new Image();
vidaImg.src = "assets/vida.png";

const coinImg = new Image();
coinImg.src = "assets/coin.png";

const rareCoinImg = new Image();
rareCoinImg.src = "assets/5coins.png";
const RARE_COIN_SCALE = 2.0; // 200% más grande

const sueloImg = new Image();
sueloImg.src = "assets/suelo.jpg";

// multiplicador de velocidad del juego
let gameSpeed = 1;
const MAX_GAME_SPEED = 2.5;

// Cámara
const camera = { x: 0 };

// Contador
let score = 0;
let bestScore = 0;
//let distanceScore = 0;

// Vida
let vidas = 3;
const MAX_VIDAS = 3;

// Respawn
let invencible = false;
let invencibleTimer = 0;
const INVENCIBLE_TIME = 120;

// Coins
let coins = 0;
let coinsTotal = 0; // acumulador para regenerar vidas

let monedas = [];


// Jugador
const player = {
  x: 100, y: 100,
  w: 48, h: 48,
  velX: 0, velY: 0,
  speed: 4, jumpPower: 12,
  direction: 1,
  onGround: false,
  state: "idle",
  jumpCount: 0,
  maxJumps: 2
};

const gravity = 0.5;

// Animaciones jugador
const animations = {
  idle: { start: 3, end: 3 },
  run: { start: 1, end: 7 },
  jump: { start: 1, end: 7 }
};

// Animaciones enemigos
const enemyAnimations = {
  walk:   { start: 0, end: 15 },
  idle:   { start: 16, end: 25 },
  attack: { start: 26, end: 40 }
};
let frame = 0;
let frameTimer = 0;
const frameSpeed = 5;

const FRAME_WIDTH = 48;
const FRAME_HEIGHT = 48;

// Plataformas
let plataformas = [];
let suelo = [];

let lastPlatformX = 0;
let lastGroundX = 0;

const GROUND_Y = 460;
const GROUND_HEIGHT = 30;
const GROUND_SEGMENT_WIDTH = 300;

// Enemigos
let enemigos = [];
const ENEMY_FRAMES = 41;
const ENEMY_WIDTH = 48;
const ENEMY_HEIGHT = 48;


// Estado del juego
let gameOver = false;

// Teclado
const keys = {};
let canJump = true;

document.addEventListener("keydown", e => {
  if (!keys[e.code]) keys[e.code] = true;
});

document.addEventListener("keyup", e => {
  keys[e.code] = false;
  if (e.code === "Space") canJump = true;
});

function generarSueloHasta(xObjetivo) {
  while (lastGroundX < xObjetivo) {

    suelo.push({
      x: lastGroundX,
      y: GROUND_Y,
      w: GROUND_SEGMENT_WIDTH,
      h: GROUND_HEIGHT
    });

    // Coin en el suelo
    if (Math.random() < 0.30) {
      generarCoin(
        lastGroundX + GROUND_SEGMENT_WIDTH / 2,
        GROUND_Y - 30,
        Math.random() < 0.25 ? "rare" : "normal"
      );
    } 

    lastGroundX += GROUND_SEGMENT_WIDTH;
  }
}


function generarPlataforma() {
  const gapMin = 120;
  const gapMax = 260;
  const gap = gapMin + Math.random() * (gapMax - gapMin);

  const SCALE = 0.25;
  const width = 422 * SCALE;
  const height = 252 * SCALE;

  const minY = 220;
  const maxY = 360;
  const y = minY + Math.random() * (maxY - minY);

  const x = lastPlatformX + gap;

  plataformas.push({ x, y, w: width, h: height });
  lastPlatformX = x + width;

  // Coin encima de la plataforma (40% de probabilidad)
  if (Math.random() < 0.4) {
    generarCoin(
      x + width / 2 - 12,
    y - 30
    );
  }
}

function generarEnemigo() {
  if (Math.random() < 0.009) {
    enemigos.push({
      x: camera.x + canvas.width + 50,
      y: GROUND_Y - ENEMY_HEIGHT,
      w: ENEMY_WIDTH,
      h: ENEMY_HEIGHT,
      speed: 2,

      state: "walk",
      frame: enemyAnimations["walk"].start,
      frameTimer: 0,
      dead: false
    });
  }
}

function updatePlataformas() {
  const limiteGeneracion = camera.x + canvas.width * 2;

  generarSueloHasta(limiteGeneracion);

  while (lastPlatformX < limiteGeneracion) {
    generarPlataforma();
  }

  plataformas = plataformas.filter(p => p.x + p.w > camera.x - 300);
  suelo = suelo.filter(s => s.x + s.w > camera.x - 600);
}

function updateAnimation() {
  const anim = animations[player.state];

  frameTimer++;
  if (frameTimer >= frameSpeed) {
    frame++;
    if (frame > anim.end) frame = anim.start;
    frameTimer = 0;
  }
}

function colision(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function perder() {
  if (gameOver) return;

  vidas--;

  if (vidas <= 0) {
    gameOver = true;
    setTimeout(() => {
      alert("Se te han acabado las vidas! Tu puntuación final es: " + score);
      resetGame();
    }, 100);
  } else {
    // Respawn
    player.x -= 80;
    player.y = 100;
    player.velX = 0;
    player.velY = 0;

    invencible = true;
    invencibleTimer = INVENCIBLE_TIME;
  }
}

function updateState() {
  if (!player.onGround) player.state = "jump";
  else if (player.velX !== 0) player.state = "run";
  else player.state = "idle";
}


function update() {
  if (gameOver) return;
    player.velX = 0;

  if (invencible) {
    invencibleTimer--;
  if (invencibleTimer <= 0) {
    invencible = false;
  }
}

  // Aumentar la velocidad del juego con la puntuación
  gameSpeed = 1 + score / 200;
  gameSpeed = Math.min(gameSpeed, MAX_GAME_SPEED);

  // MOVIMIENTO HORIZONTAL
  if (keys["ArrowRight"]) {
    player.velX = player.speed * gameSpeed;
    player.direction = 1;
  }
  if (keys["ArrowLeft"]) {
    player.velX = -player.speed * gameSpeed;
    player.direction = -1;
  }

  monedas.forEach(coin => {
  if (!coin.collected && colision(player, coin)) {
    coin.collected = true;
    coins += coin.value;
    score += coin.value;      
    coinsTotal += coin.value;

// Cada 10 coins = +1 vida
    if (coinsTotal >= 10) {
      const vidasGanadas = Math.floor(coinsTotal / 10);
      vidas = Math.min(MAX_VIDAS, vidas + vidasGanadas);
      coinsTotal %= 10;
    }
  }
});

// Eliminar coins recogidas o fuera de cámara
monedas = monedas.filter(
  c => !c.collected && c.x + c.w > camera.x - 200
);


  // SALTO
  if (keys["Space"] && canJump && player.jumpCount < player.maxJumps) {
    player.velY = -player.jumpPower;
    player.jumpCount++;
    player.onGround = false;
    canJump = false;
  }

  const prevY = player.y;

  player.velY += gravity;
  player.x += player.velX;
  player.y += player.velY;
  player.onGround = false;

  [...plataformas, ...suelo].forEach(p => {
    if (colision(player, p)) {
      if (prevY + player.h <= p.y) {
        player.y = p.y - player.h;
        player.velY = 0;
        player.onGround = true;
        player.jumpCount = 0;
      } else if (prevY >= p.y + p.h) {
        player.y = p.y + p.h;
        player.velY = 0.5;
      } else if (player.x + player.w - player.velX <= p.x) {
        player.x = p.x - player.w;
      } else if (player.x - player.velX >= p.x + p.w) {
        player.x = p.x + p.w;
      }
    }
  });

  if (player.y > canvas.height + 200) resetGame();

  camera.x = player.x - canvas.width / 2;
  if (camera.x < 0) camera.x = 0;

  // Score  por distancia
  //distanceScore = Math.max(score, Math.floor(player.x / 500));
  //score = distanceScore;

  generarEnemigo();
  enemigos.forEach(enemigo => {
    enemigo.x -= enemigo.speed * gameSpeed;

    // Estado
    enemigo.state = "walk";

    // Colision
    if (colision(player, enemigo)) {
      const playerBottom = player.y + player.h;
      const enemyTop = enemigo.y;
      if(player.velY > 0 && playerBottom - player.velY <= enemyTop + 10){
        // El jugador salta sobre el enemigo
        enemigo.dead = true;
        player.velY = -player.jumpPower / 2; // Rebote al saltar sobre el enemigo
        score += 12;
      }else{
        if (!invencible) {
        enemigo.state = "attack";
        perder();
}
    }
    }

    // Animación
    const anim = enemyAnimations[enemigo.state];
    enemigo.frameTimer++;

    if (enemigo.frameTimer >= frameSpeed) {
      enemigo.frame++;
      if (enemigo.frame > anim.end) enemigo.frame = anim.start;
      enemigo.frameTimer = 0;
    }
  });
  enemigos = enemigos.filter(e => !e.dead && e.x + e.w > camera.x - 200);  

  updateState();
  updateAnimation();
  updatePlataformas();
}

function resetGame() {
  gameOver = false;
  enemigos = [];
  player.x = 100;
  player.y = 100;
  player.velX = 0;
  player.velY = 0;
  player.jumpCount = 0;
  plataformas = [];
  suelo = [];
  lastPlatformX = 0;
  lastGroundX = 0;
  camera.x = 0;
  for (let k in keys) delete keys[k];
  bestScore = Math.max(bestScore, score);
  score = 0;
  //distanceScore = 0;
  vidas = MAX_VIDAS;
  invencible = false;
  invencibleTimer = 0;
  monedas = [];
  coins = 0;
  coinsTotal = 0;
  gameSpeed = 1;

}

function drawFondo() {
  const speed = 0.3;
  const offset = (camera.x * speed) % fondoImg.width;

  for (let x = -offset; x < canvas.width; x += fondoImg.width) {
    ctx.drawImage(fondoImg, x, 0, fondoImg.width, canvas.height);
  }
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x - camera.x + player.w/2, player.y + player.h/2);
  ctx.scale(player.direction, 1);

  // Parpadeo si es invencible
  if (invencible && Math.floor(invencibleTimer / 5) % 2 === 0) {
    ctx.restore();
    return;
  }

  ctx.drawImage(
    playerImg,
    frame * FRAME_WIDTH, 0,
    FRAME_WIDTH, FRAME_HEIGHT,
    -player.w/2, -player.h/2,
    player.w, player.h
  );
  ctx.restore();
}

function drawEnemies() {
  if (!enemigoImg.complete) return;

  enemigos.forEach(enemigo => {
    ctx.drawImage(
      enemigoImg,
      enemigo.frame * ENEMY_WIDTH, 0,
      ENEMY_WIDTH, ENEMY_HEIGHT,
      enemigo.x - camera.x, enemigo.y,
      enemigo.w, enemigo.h
    );
  });
}

function drawScore() {
  ctx.save();
  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.textAlign = "left";
  ctx.fillText(`Puntuación: ${score}`, 20, 30);
  ctx.fillText(`Mejor Puntuación: ${bestScore}`, 20, 60);

  ctx.fillText(`Coins: ${coins}`, 20, 90);

}

function drawLives() {
  const size = 28;
  const margin = 10;

  for (let i = 0; i < vidas; i++) {
    ctx.drawImage(
      vidaImg,
      canvas.width - (i + 1) * (size + margin),
      15,
      size,
      size
    );
  }
}

function generarCoin(x, y, type = "normal") {
  monedas.push({
    x,
    y,
    w: 24,
    h: 24,
    type,
    value: type === "rare" ? 5 : 1,
    collected: false
  });
}

function drawCoins() {
  monedas.forEach(coin => {
    const img = coin.type === "rare" ? rareCoinImg : coinImg;

    let w = coin.w;
    let h = coin.h;

    if (coin.type === "rare") {
      const pulse = 1 + Math.sin(Date.now() / 200) * 0.3;
      w *= pulse;
      h *= pulse;
      w *= RARE_COIN_SCALE;
      h *= RARE_COIN_SCALE;
    } else {
      const pulse = 1 + Math.sin(Date.now() / 300) * 0.1;
      w *= pulse;
      h *= pulse;
    }

    ctx.drawImage(
      img,
      coin.x - camera.x - (w - coin.w) / 2, // centrado
      coin.y - (h - coin.h) / 2,
      w,
      h
    );
  });
}

function draw() {
  drawFondo();

  suelo.forEach(s => {
    ctx.drawImage(sueloImg, s.x - camera.x, s.y, s.w, s.h);
  });

  plataformas.forEach(p => {
    ctx.drawImage(plataformaImg, p.x - camera.x, p.y, p.w, p.h);
  });
  drawCoins();
  drawEnemies();
  drawPlayer();
  drawScore();
  drawLives();
}

function loop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  update();
  draw();
  requestAnimationFrame(loop);
}

fondoImg.onload = () => loop();
</script>

</body>
</html>
